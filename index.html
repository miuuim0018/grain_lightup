<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>集食・點光 | 嘉義大學數位系公益專案</title>
    <style>
        /* 基礎重置與文青系變數設定 */
        :root {
            --primary-color: #695e55; /* 深褐色 */
            --secondary-color: #faf8f5; /* 燕麥白背景 */
            --accent-color: #8a9382; /* 莫蘭迪綠 */
            --accent-hover: #727a6b;
            --text-dark: #3a3a3a; /* 炭灰字體 */
            --text-light: #888888; /* 淺灰字體 */
            --bg-white: #ffffff;
            --danger-color: #a87b6d; /* 莫蘭迪磚紅 */
            --border-light: #e6e2db; /* 柔和邊線 */
            
            --earth-brown: #a68f7b; /* 奶茶棕 */
            --earth-green: #8a9382; /* 莫蘭迪綠 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang TC', 'Helvetica Neue', 'Microsoft JhengHei', sans-serif;
            letter-spacing: 0.05em;
        }

        body {
            background-color: var(--secondary-color);
            color: var(--text-dark);
            line-height: 1.8;
            scroll-behavior: smooth;
        }

        a {
            text-decoration: none;
            color: var(--primary-color);
            transition: all 0.3s ease;
        }

        a:hover {
            color: var(--accent-color);
        }

        /* 導覽列 */
        header {
            background-color: rgba(250, 248, 245, 0.95);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid var(--border-light);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 18px;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.1em;
        }

        .logo img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        .nav-links a:hover {
            color: var(--primary-color);
        }

        /* 主視覺區塊 */
        .hero {
            margin-top: 60px;
            padding: 100px 20px 60px;
            text-align: center;
            background-color: var(--secondary-color);
        }

        .hero h1 {
            font-size: 2.2rem;
            margin-bottom: 25px;
            color: var(--primary-color);
            font-weight: 500;
            letter-spacing: 0.15em;
        }

        .hero p {
            font-size: 1.1rem;
            max-width: 700px;
            margin: 0 auto 35px;
            color: var(--text-light);
        }

        .cta-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--primary-color) !important;
            padding: 10px 28px;
            border: 1px solid var(--primary-color);
            border-radius: 4px;
            font-size: 1rem;
            transition: all 0.4s ease;
        }

        .cta-btn:hover {
            background-color: var(--primary-color);
            color: var(--bg-white) !important;
        }

        /* 倒數計時器 */
        .countdown-wrapper {
            max-width: 500px;
            margin: -20px auto 50px;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid var(--border-light);
            background-color: var(--bg-white);
            position: relative;
            z-index: 10;
            text-align: center;
        }

        .countdown-title {
            color: var(--danger-color);
            margin-bottom: 15px;
            font-size: 0.95rem;
            letter-spacing: 0.1em;
        }

        .timer-display {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .time-box {
            text-align: center;
            min-width: 60px;
        }

        .time-box span.number {
            display: block;
            font-size: 1.8rem;
            color: var(--primary-color);
            font-weight: 300;
            line-height: 1.2;
        }

        .time-box span.label {
            font-size: 0.75rem;
            color: var(--text-light);
        }

        /* 內容區塊共用設定 */
        .section-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 70px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 1.6rem;
            margin-bottom: 50px;
            color: var(--primary-color);
            font-weight: 500;
            position: relative;
            padding-bottom: 20px;
            letter-spacing: 0.1em;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 1px;
            background-color: var(--border-light);
        }

        /* 關於我們區塊 */
        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            background: transparent;
        }

        .about-content p {
            margin-bottom: 20px;
            color: var(--text-dark);
        }

        .about-card {
            padding: 0 0 0 20px;
            border-left: 1px solid var(--border-light);
            margin-bottom: 30px;
        }

        .about-card h3 {
            margin-bottom: 10px;
            font-size: 1rem;
            color: var(--primary-color);
            font-weight: normal;
        }

        /* 特別強化純文字連結的視覺提示 (UX 優化) */
        .text-link {
            color: var(--danger-color); /* 使用莫蘭迪磚紅，跳脫一般文字 */
            border-bottom: 1px solid var(--danger-color);
            padding-bottom: 1px;
            font-weight: 500;
            display: inline-block;
            margin-top: 5px;
        }
        
        .text-link:hover {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        /* 影音紀錄區塊 */
        .verification-card {
            background-color: var(--bg-white);
            padding: 40px 30px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            border: 1px solid var(--border-light);
        }

        .verification-card h3 {
            color: var(--primary-color);
            font-weight: 500;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .verification-card p {
            color: var(--text-light);
            font-size: 0.95rem;
            max-width: 600px;
            margin: 0 auto;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        .btn-social {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 0.9rem;
            transition: all 0.4s ease;
            background-color: transparent;
            border: 1px solid;
            cursor: pointer;
        }

        .btn-npo { 
            color: var(--earth-brown) !important;
            border-color: var(--earth-brown);
        }
        
        .btn-npo:hover { 
            background-color: var(--earth-brown);
            color: var(--bg-white) !important;
        }

        .btn-team { 
            color: var(--earth-green) !important;
            border-color: var(--earth-green);
        }
        
        .btn-team:hover { 
            background-color: var(--earth-green);
            color: var(--bg-white) !important;
        }

        /* 照片牆排版 */
        .impact-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 25px;
            margin-bottom: 50px;
        }

        .impact-img-container {
            border-radius: 4px;
            overflow: hidden;
            background: var(--bg-white);
            aspect-ratio: 4 / 3;
            display: block;
        }

        .impact-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
            filter: grayscale(10%);
        }

        .impact-img-container:hover img {
            transform: scale(1.03);
            filter: grayscale(0%);
        }

        .gallery-title {
            text-align: left;
            font-size: 1.1rem;
            font-weight: normal;
            color: var(--primary-color);
            margin: 40px 0 15px;
            letter-spacing: 0.1em;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 10px;
        }

        /* 行動承諾區塊 */
        .pledge-banner {
            background-color: var(--bg-white);
            border: 1px solid var(--border-light);
            color: var(--primary-color);
            text-align: center;
            padding: 50px 20px;
            border-radius: 8px;
            margin: 50px 0;
        }

        .pledge-banner h2 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: 500;
        }

        /* 圖解 FAQ 輪播區塊 */
        .faq-carousel-container {
            margin-bottom: 50px;
            background: transparent;
        }

        .faq-carousel-container h3 {
            margin-bottom: 20px;
            color: var(--primary-color);
            font-weight: normal;
            font-size: 1.1rem;
            text-align: center;
        }

        .faq-carousel {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding-bottom: 20px;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch; 
        }

        .faq-carousel::-webkit-scrollbar { height: 4px; }
        .faq-carousel::-webkit-scrollbar-track { background: transparent; }
        .faq-carousel::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 2px; }

        .faq-carousel img {
            height: 300px;
            width: auto;
            max-width: 85vw;
            object-fit: contain;
            flex-shrink: 0;
            scroll-snap-align: center;
            border-radius: 4px;
            border: 1px solid var(--border-light);
            background-color: var(--bg-white);
        }

        /* 文字 FAQ 區塊 */
        .faq-item {
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 0;
        }

        .faq-question {
            padding: 25px 0;
            font-size: 1rem;
            color: var(--primary-color);
            cursor: pointer;
            display: flex;
            justify-content
